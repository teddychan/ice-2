name: Tests

# Runs the unit-test suite on every PR to main (and pushes to main). Build/release stays in
# release.yml — this job never signs, notarizes, or releases anything.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    # macOS 26 image: same runner the release build targets (macOS 26 SDK, Swift 6.2).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      # The Ice scheme's test action runs the IceTests target, hosted in the Ice 2 app. The
      # Debug configuration signs ad-hoc ("Sign to Run Locally"), so the suite builds on this
      # runner with no Apple Development certificate and needs no signing overrides. Package
      # dependencies resolve automatically from the committed Package.resolved.
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Ice.xcodeproj \
            -scheme Ice \
            -destination 'platform=macOS,arch=arm64'
