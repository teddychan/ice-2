name: Release

# Thin caller: delegates to the shared macOS release pipeline
# (teddychan/dragon-release-ci). Archive + export (Developer ID) via xcodebuild,
# notarize, staple, publish Ice 2, push the Sparkle appcast to docs/ice-2/, and
# bump the Homebrew cask. Triggered by a v* tag on this repo.
#
# Secrets are inherited from this repo's Actions secrets:
#   DEVELOPER_ID_CERT_P12_BASE64, DEVELOPER_ID_CERT_PASSWORD,
#   NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID, NOTARY_ISSUER_ID,
#   PUBLIC_RELEASE_TOKEN, SPARKLE_EDDSA_PRIVATE_KEY
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# The reusable release workflow creates the GitHub Release and uploads assets,
# which needs contents: write. This repo's default workflow token is read-only,
# so grant write here or the reusable call is rejected at startup.
permissions:
  contents: write

jobs:
  release:
    uses: teddychan/dragon-release-ci/.github/workflows/release-macos.yml@v6
    secrets: inherit
    with:
      # v6's tag gate replaces v5's `VERSION=${TAG##*v}`, which left a value containing no "v"
      # untouched — so a workflow_dispatch arrived with a BRANCH ref and produced VERSION=main.
      # It also accepts only exact `vX.Y.Z`, and requires whats_new_path: the two move together,
      # because passing whats_new_path to v5 fails at startup (v5 does not define the input) and
      # omitting it on v6 fails the gate.
      #
      # Ice 2's notes are raw Swift string literals — English-only, no Localizable.strings in the
      # repo at all — so the text a user reads is in this one file and watching it is a real
      # check. spectacle-2 and yahoo-keykey-2 keep theirs behind abstract `L()` keys and have to
      # list their translations as well.
      whats_new_path: Ice/Settings/WhatsNewConfig.swift
      build_kind: xcodebuild
      # Ice 2 targets the macOS 26 SDK, so build on a macos-26 runner (the
      # default macos-15 image lacks the SDK). This input drives the job's
      # runs-on for all build kinds, not just swiftpm.
      swiftpm_runner: macos-26
      app_slug: ice-2
      # Step 1 of 2 in moving the appcast off the marketing site.
      #
      # MAC-APP-RELEASE-LIFECYCLE.md: "Sparkle appcasts are update infrastructure, not marketing
      # content. Each app should host its production appcast in its own repository so an outage,
      # permission problem, or rejected change in the marketing-site repository cannot interfere
      # with update delivery." Until now this caller passed no appcast_repo at all and took the
      # default, teddychan/www.dragonapp.com. spectacle-2, dragon-sample-app and clipmenu-2 have
      # migrated; yahoo-keykey-2 has not.
      #
      # The same spec says to migrate "by mirroring the old and new locations until installed
      # versions have moved to the app-owned URL", which is why this is two releases and not one.
      # Every ALREADY-INSTALLED Ice 2 reads SUFeedURL from the site, so flipping the destination
      # alone would leave all of them silently unable to see updates.
      #
      #   step 1 (here)  publish to BOTH. Ice/Resources/Info.plist keeps pointing at the site,
      #                  which is still being written, so nothing changes for anyone — but the
      #                  app-owned feed now exists and is current.
      #   step 2 (next)  move SUFeedURL to
      #                  https://raw.githubusercontent.com/teddychan/ice-2/main/docs/ice-2/appcast.xml
      #                  once step 1 has actually populated it.
      #   later          drop appcast_mirror_repo when no supported version still reads the site.
      #
      # Needs dragon-release-ci >= v6.3.0. The appcast is generated once and copied to both, so
      # the two locations cannot disagree. Publishing to this repo uses the built-in GITHUB_TOKEN
      # (contents: write is granted above); the mirror is a different repo and so needs
      # PUBLIC_RELEASE_TOKEN, which `secrets: inherit` already supplies — the same token that
      # publishes to the site today. A missing mirror token is a hard error, not a warning.
      #
      # Ice 2 is the first xcodebuild-built app to use this: generate_appcast is located under the
      # derived-data SourcePackages artifacts (generate_appcast_glob: xcodebuild, below) rather
      # than a SwiftPM .build directory. That lookup is unchanged and already runs on every
      # release — only the publish destinations move.
      appcast_repo: teddychan/ice-2
      appcast_mirror_repo: teddychan/www.dragonapp.com
      release_title_prefix: Ice 2
      bot_name: Ice 2 Release Bot
      xcode_project: Ice.xcodeproj
      xcode_scheme: Ice
      xcode_export_options: .github/release/exportOptions.plist
      xcode_development_team: 4AF3KGGV29
      # Fail the release (before notarization) if the tag doesn't match the
      # exported app's CFBundleShortVersionString — i.e. the Ice target's
      # MARKETING_VERSION in Ice.xcodeproj. Guards against tagging vX.Y.Z without
      # bumping the project, which would ship an app reporting the old version and
      # put a stale version in the Sparkle appcast.
      assert_tag_matches_plist: true
      zip_name_template: 'Ice-2-{TAG}.zip'
      zip_keep_parent: true
      generate_appcast_glob: xcodebuild
